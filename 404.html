<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page not found - NakamaList</title>
<meta name="robots" content="noindex, follow"/>
<meta name="theme-color" content="#08070d"/>
<!-- absolute paths: GitHub Pages serves this file for any depth of missing URL -->
<link rel="icon" href="/NakamaList/assets/icon-256.webp" type="image/webp"/>
<link rel="icon" href="/NakamaList/assets/nakamalist_icon_rounded.png" sizes="any"/>
<style>
:root{--ink:#08070d;--text:#f6f5fa;--muted:#918ca6;--dim:#7a7692;
  --line-strong:#615986;--violet:#8b6cff;--violet-lt:#b79bff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;
  padding:40px clamp(20px,5vw,60px);text-align:center;background:var(--ink);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--violet-lt);outline-offset:3px;border-radius:6px}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(120px);width:60vw;height:60vw;
  max-width:700px;max-height:700px;background:#5b39d6;opacity:.26;top:-20vh;left:-12vw}
main{position:relative;z-index:1;max-width:44ch}
.mark{display:inline-flex;align-items:center;gap:11px;font-weight:700;font-size:16px;
  letter-spacing:-.02em;margin-bottom:34px}
.mark img{width:28px;height:28px;border-radius:8px;display:block}
h1{font-size:clamp(3.4rem,13vw,6rem);font-weight:700;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(96deg,var(--violet-lt),#eab0ff 52%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){h1{color:var(--violet-lt)}}
h2{font-size:clamp(1.3rem,4vw,1.7rem);font-weight:600;letter-spacing:-.02em;margin:18px 0 0}
p{color:var(--muted);margin-top:16px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;
  font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s,border-color .2s}
.btn.solid{background:linear-gradient(135deg,var(--violet),#a683ff);color:#fff;
  box-shadow:0 14px 40px rgba(139,108,255,.35)}
.btn.solid:hover{transform:translateY(-2px)}
.btn.line{border:1px solid var(--line-strong);color:var(--text)}
.btn.line:hover{border-color:var(--violet)}
small{display:block;margin-top:38px;color:var(--dim);font-size:12.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i></div>
<main>
  <a class="mark" href="/NakamaList/">
    <img src="/NakamaList/assets/icon-256.webp" alt="" width="28" height="28"/>NakamaList
  </a>
  <h1>404</h1>
  <h2>This page is not on our list.</h2>
  <p>The link may be out of date, or the page may have moved. Everything is still one tap away.</p>
  <div class="row">
    <a class="btn solid" href="/NakamaList/">Back to NakamaList</a>
    <a class="btn line" href="https://play.google.com/store/apps/details?id=com.nakamalist.app"
       rel="noopener">Get the app</a>
  </div>
  <small>Something broken? <a href="mailto:nakamalist@proton.me" style="color:var(--muted)">nakamalist@proton.me</a></small>
</main>
</body>
</html>
